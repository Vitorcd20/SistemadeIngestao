server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The backend is unreachable except through this proxy (see
        # docker-compose.yml), so it can safely trust this unconditionally
        # via server.forward-headers-strategy=framework -- there's no path
        # for an external caller to spoof it.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE (/api/jobs/*/events) must not be buffered, or the client only
        # sees updates once nginx's buffer fills instead of as they happen.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }

    # Allow direct large uploads through nginx without a client-side cap.
    client_max_body_size 2G;

    location / {
        # SPA fallback: any path without a matching static file (a client
        # route like /dashboard on direct reload, or a genuinely unknown
        # path) falls through to index.html so React Router can handle it
        # -- including rendering the catch-all NotFoundPage for the latter.
        try_files $uri $uri/ /index.html;
    }
}
